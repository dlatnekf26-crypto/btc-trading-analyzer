[server]
headless = true
enableCORS = true
enableXsrfProtection = true
enableStaticServing = false
maxUploadSize = 1
maxMessageSize = 50

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#4ADEB8"
backgroundColor = "#080C14"
secondaryBackgroundColor = "#111A2B"
textColor = "#E8EEF8"
