[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-trading-analyzer"
version = "0.1.0"
description = "Causal BTC analysis, backtesting and paper trading dashboard"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3", "numpy>=2,<2.4", "scipy>=1.14,<1.17", "ccxt>=4.4,<5",
  "requests>=2.32,<3", "python-dotenv>=1,<2", "plotly>=5.24,<7", "streamlit>=1.40,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
